<!DOCTYPE html>
<html>
<head>
  <title>Luna Dress Shop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f8;
      color: #333;
    }

    /* Header */
    header {
      background: #c2185b;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    /* Navigation */
    nav {
      background: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px #ddd;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #c2185b;
      font-weight: bold;
    }

    /* Shop */
    .shop {
      padding: 35px 20px;
      text-align: center;
    }

    .shop h2 {
      color: #c2185b;
      margin-bottom: 25px;
    }

    .dress {
      display: inline-block;
      vertical-align: top;
      background: white;
      width: 220px;
      margin: 12px;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #ddd;
      transition: 0.3s;
    }

    .dress:hover {
      transform: translateY(-5px);
    }

    .dress img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 8px;
    }

    .dress h3 {
      margin: 12px 0 8px;
    }

    .price {
      color: #c2185b;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      background: #c2185b;
      color: white;
      border: 0;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #8e1645;
    }

    /* Footer */
    footer {
      margin-top: 30px;
      background: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .dress {
        width: 90%;
        max-width: 300px;
      }

      nav a {
        margin: 0 5px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>?? Luna Dress Shop</h1>
    <p>Fashion for Every Occasion</p>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#shop">Shop</a>
    <a href="#contact">Contact</a>
    ?? Cart: <span id="cart">0</span>
  </nav>

  <section class="shop" id="shop">

    <h2>Our Dresses</h2>

    <div class="dress">
      <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=400&q=80">
      <h3>Pink Dress</h3>
      <p class="price">$50</p>
      <button onclick="addCart()">Buy Now</button>
    </div>

    <div class="dress">
      <img src="https://images.unsplash.com/photo-1539008835657-9e8e9680c956?auto=format&fit=crop&w=400&q=80">
      <h3>Black Dress</h3>
      <p class="price">$60</p>
      <button onclick="addCart()">Buy Now</button>
    </div>

    <div class="dress">
      <img src="https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=400&q=80">
      <h3>Evening Dress</h3>
      <p class="price">$75</p>
      <button onclick="addCart()">Buy Now</button>
    </div>

    <div class="dress">
      <img src="https://images.unsplash.com/photo-1591369822096-ffd140ec948f?auto=format&fit=crop&w=400&q=80">
      <h3>White Dress</h3>
      <p class="price">$55</p>
      <button onclick="addCart()">Buy Now</button>
    </div>

    <div class="dress">
      <img src="https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=400&q=80">
      <h3>Red Dress</h3>
      <p class="price">$70</p>
      <button onclick="addCart()">Buy Now</button>
    </div>

    <div class="dress">
      <img src="https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=400&q=80">
      <h3>Floral Dress</h3>
      <p class="price">$65</p>
      <button onclick="addCart()">Buy Now</button>
    </div>

  </section>

  <footer id="contact">
    <p>?? Email: luna@example.com</p>
    <p>? 2026 Luna Dress Shop</p>
  </footer>

  <script>
    let cart = 0;

    function addCart() {
      cart++;
      document.getElementById("cart").textContent = cart;
      alert("Dress added to cart!");
    }
  </script>

</body>
</html>
